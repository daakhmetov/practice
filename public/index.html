<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --surface-soft: #f0efeb;
      --text: #202124;
      --muted: #62666d;
      --line: #d8d6d0;
      --brand: #245f73;
      --brand-hover: #1d4c5c;
      --success: #237449;
      --danger: #b0443e;
      --warning: #8a670f;
      --warning-row: #fff8e5;
      --error-row: #fff0ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    .page {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .seed-link {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      padding: 0 12px;
      white-space: nowrap;
    }

    .seed-link:hover {
      border-color: var(--brand);
      color: var(--brand);
    }

    .workspace {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .sidebar {
      display: grid;
      gap: 12px;
      position: sticky;
      top: 18px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
    }

    .panel-title {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-transform: uppercase;
    }

    .stats-grid {
      display: grid;
      gap: 8px;
    }

    .stat-card {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      background: transparent;
      border: 0;
      border-top: 1px solid var(--line);
      border-radius: 6px;
      padding: 11px 0 0;
    }

    .stat-card:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .stat-card span {
      color: var(--muted);
      font-size: 13px;
    }

    .stat-card strong {
      font-size: 22px;
      font-weight: 650;
      line-height: 1.1;
      text-align: right;
      white-space: nowrap;
    }

    .toolbar {
      display: grid;
      gap: 8px;
    }

    .main-panel {
      min-width: 0;
    }

    .table-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .table-heading h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
    }

    .table-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    input,
    select {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      padding: 0 11px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(36, 95, 115, 0.16);
    }

    .notice {
      min-height: 22px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      text-align: right;
    }

    .notice.error {
      color: var(--danger);
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    table {
      width: 100%;
      min-width: 880px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: var(--surface-soft);
      color: #42464d;
      font-size: 12px;
      font-weight: 650;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #faf9f6;
    }

    tr.status-error {
      background: var(--error-row);
    }

    tr.low-stock:not(.status-error) {
      background: var(--warning-row);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      border: 1px solid currentColor;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 650;
      background: var(--surface);
    }

    .badge.Online {
      color: var(--success);
    }

    .badge.Offline {
      color: #5a5f66;
    }

    .badge.Error {
      color: var(--danger);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      min-height: 34px;
      border: 1px solid var(--brand);
      border-radius: 6px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      padding: 0 11px;
    }

    button:hover {
      background: var(--brand-hover);
      border-color: var(--brand-hover);
    }

    button.secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--line);
    }

    button.secondary:hover {
      color: var(--brand);
      border-color: var(--brand);
      background: var(--surface);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .empty-state {
      padding: 26px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 860px) {
      .topbar {
        display: grid;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(150px, 1fr));
      }

      .stat-card {
        display: block;
        border-top: 0;
        border-left: 1px solid var(--line);
        padding: 0 0 0 10px;
      }

      .stat-card strong {
        display: block;
        margin-top: 4px;
        text-align: left;
      }

      .seed-link {
        width: max-content;
      }

      .table-heading,
      .notice {
        display: block;
        text-align: left;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 20px, 1160px);
        padding-top: 18px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .brand h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <h1>Мониторинг</h1>
        <p>Панель контроля вендинговых автоматов</p>
      </div>
      <a class="seed-link" href="/api/seed" target="_blank" rel="noreferrer">Заполнить демо-данными</a>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="Сводка и фильтры">
        <section class="panel">
          <h2 class="panel-title">Сводка</h2>
          <div class="stats-grid" aria-label="Статистика парка автоматов">
            <article class="stat-card">
              <span>Всего автоматов</span>
              <strong id="totalMachines">0</strong>
            </article>
            <article class="stat-card">
              <span>В сети</span>
              <strong id="onlineMachines">0</strong>
            </article>
            <article class="stat-card">
              <span>Ошибки</span>
              <strong id="errorMachines">0</strong>
            </article>
            <article class="stat-card">
              <span>Общая касса</span>
              <strong id="totalRevenue">0 ₸</strong>
            </article>
          </div>
        </section>

        <section class="panel">
          <h2 class="panel-title">Фильтры</h2>
          <div class="toolbar" aria-label="Фильтры">
            <input id="searchInput" type="search" placeholder="Поиск по ID или адресу">
            <select id="statusFilter">
              <option value="">Все статусы</option>
              <option value="Online">Online</option>
              <option value="Offline">Offline</option>
              <option value="Error">Error</option>
            </select>
          </div>
        </section>
      </aside>

      <section class="main-panel" aria-label="Список автоматов">
        <div class="table-heading">
          <div>
            <h2>Автоматы</h2>
            <p>Состояние, остатки и инкассация по точкам</p>
          </div>
          <p id="notice" class="notice"></p>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID автомата</th>
                <th>Адрес</th>
                <th>Статус</th>
                <th>Остаток</th>
                <th>Касса</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="machinesTableBody">
              <tr>
                <td colspan="6" class="empty-state">Загрузка данных...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
